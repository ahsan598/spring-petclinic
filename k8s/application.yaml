apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-petclinic
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    
spec:
  project: default
  source:
    repoURL: 'https://github.com/ahsan598/spring-petclinic.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: webapps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
